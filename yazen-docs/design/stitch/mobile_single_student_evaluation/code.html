<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mobile Single Student Evaluation</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#14a6f5",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #101c22;
        }
        ::-webkit-scrollbar-thumb {
            background: #223b49;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #305569;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Mobile-First Container centered on Desktop -->
<div class="w-full max-w-[480px] h-[90vh] flex flex-col bg-white dark:bg-[#182a34] shadow-2xl rounded-xl overflow-hidden border border-slate-200 dark:border-[#223b49] relative">
<!-- Header: Student Info -->
<header class="bg-[#101c22] p-6 pb-8 border-b border-[#223b49] shrink-0 relative z-10">
<div class="flex items-center justify-between mb-4">
<button class="text-slate-400 hover:text-white transition-colors p-1 rounded-full hover:bg-white/10">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-sm">school</span>
<span class="text-xs font-bold uppercase tracking-wider">Grade Entry</span>
</div>
<button class="text-slate-400 hover:text-white transition-colors p-1 rounded-full hover:bg-white/10">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
<div class="flex flex-col items-center text-center">
<div class="relative mb-3">
<div class="w-24 h-24 rounded-full bg-cover bg-center border-4 border-[#223b49] shadow-lg" data-alt="Portrait of student Maria Oliveira" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBe_kkadjNV2C0zltEEND65lyfWz29MOLayTRRdve4FucE5wwQqewWrGyS2WRI_Bx0PDlJuVEL_UhPWz8kAkYKvIDEhlx46zuF2lar9s7RD58f_OIUIBqrshD2_HH6T3d4WSN04RLyiwE1wqZOlGMGzwOQuaYPf6fkAJ666RFPefn7V6cTdqfRnXBAgQQP9U7HLtjKB2Ksp9gtA9KFIpMKRazl247APfeUSc_HVMXjmF808FpXQbT9vUn9OnpJgSy4HxnTsaAag1Cs');"></div>
<div class="absolute bottom-0 right-0 bg-emerald-500 w-5 h-5 rounded-full border-2 border-[#101c22]" title="Active Student"></div>
</div>
<h1 class="text-2xl font-bold text-white mb-1">Maria Oliveira</h1>
<p class="text-slate-400 text-sm font-light">ID: #2023-892</p>
<div class="mt-3 px-3 py-1 bg-[#223b49]/50 rounded-full border border-[#223b49]">
<p class="text-primary text-xs font-medium">8th Grade • Mathematics</p>
</div>
</div>
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 overflow-y-auto p-5 scroll-smooth relative z-0">
<!-- Grade Inputs Grid -->
<div class="grid grid-cols-2 gap-4 mb-6">
<!-- AV1 -->
<div class="group">
<label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Evaluation 1</label>
<div class="relative">
<input class="w-full bg-[#101c22] border border-[#223b49] rounded-lg text-white text-xl font-semibold py-3 px-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600 appearance-none" placeholder="0.0" type="number" value="8.5"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-medium">/10</span>
</div>
</div>
<!-- AV2 -->
<div class="group">
<label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Evaluation 2</label>
<div class="relative">
<input class="w-full bg-[#101c22] border border-[#223b49] rounded-lg text-white text-xl font-semibold py-3 px-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600 appearance-none" placeholder="0.0" type="number" value="7.0"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-medium">/10</span>
</div>
</div>
<!-- AV3 -->
<div class="group">
<label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Evaluation 3</label>
<div class="relative">
<input class="w-full bg-[#101c22] border border-[#223b49] rounded-lg text-white text-xl font-semibold py-3 px-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600 appearance-none" placeholder="0.0" type="number"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-medium">/10</span>
</div>
</div>
<!-- AV4 -->
<div class="group">
<label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Evaluation 4</label>
<div class="relative">
<input class="w-full bg-[#101c22] border border-[#223b49] rounded-lg text-white text-xl font-semibold py-3 px-4 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600 appearance-none" placeholder="0.0" type="number"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-medium">/10</span>
</div>
</div>
</div>
<!-- Final Average (Computed) -->
<div class="flex items-center justify-between bg-[#101c22] rounded-xl p-5 border border-[#223b49] mb-6 shadow-sm">
<div class="flex flex-col">
<span class="text-slate-400 text-sm font-medium mb-1">Current Average</span>
<span class="text-xs text-slate-500">Based on 2 entries</span>
</div>
<div class="relative flex items-center justify-center w-16 h-16">
<!-- Circular Progress Background -->
<svg class="w-full h-full transform -rotate-90">
<circle class="text-[#223b49]" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-dasharray="175.9" stroke-dashoffset="40" stroke-width="4"></circle>
</svg>
<span class="absolute text-white font-bold text-lg">7.8</span>
</div>
</div>
<!-- Recovery Section (Collapsible) -->
<div class="mb-6">
<details class="group bg-[#101c22] rounded-lg border border-[#223b49] overflow-hidden transition-all duration-300">
<summary class="flex items-center justify-between p-4 cursor-pointer select-none list-none hover:bg-[#223b49]/30 transition-colors">
<div class="flex items-center gap-3">
<div class="bg-orange-500/10 p-1.5 rounded text-orange-500">
<span class="material-symbols-outlined text-lg">history_edu</span>
</div>
<span class="text-slate-200 font-medium text-sm">Recovery Grade</span>
</div>
<span class="material-symbols-outlined text-slate-400 transition-transform group-open:rotate-180">expand_more</span>
</summary>
<div class="p-4 pt-0 border-t border-[#223b49]/50">
<p class="text-xs text-slate-500 mb-3 mt-3">Enter recovery grade if applicable. This may replace the lowest score.</p>
<div class="relative">
<input class="w-full bg-[#182a34] border border-[#223b49] rounded-lg text-white text-lg font-semibold py-3 px-4 focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all placeholder:text-slate-600 appearance-none" placeholder="Recovery Score" type="number"/>
</div>
</div>
</details>
</div>
<!-- Notes Section -->
<div class="mb-24">
<label class="block text-slate-400 text-xs font-medium mb-2 uppercase tracking-wide flex items-center gap-2">
<span class="material-symbols-outlined text-base">sticky_note_2</span>
                    Observations
                </label>
<textarea class="w-full bg-[#101c22] border border-[#223b49] rounded-lg text-white text-sm py-3 px-4 min-h-[100px] focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-600 resize-none" placeholder="Add specific notes about the student's performance or behavior..."></textarea>
</div>
</main>
<!-- Sticky Footer Actions -->
<footer class="absolute bottom-0 left-0 w-full p-4 bg-[#182a34]/95 backdrop-blur-sm border-t border-[#223b49] flex gap-3 z-20">
<button class="flex-1 bg-[#223b49] hover:bg-[#305569] text-white font-medium py-3.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 group border border-transparent">
<span class="material-symbols-outlined text-xl group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="hidden sm:inline">Prev</span>
</button>
<button class="flex-[3] bg-primary hover:bg-primary/90 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
<span>Save &amp; Next</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</footer>
</div>
<!-- Desktop Background Hints -->
<div class="hidden lg:block fixed -z-10 text-center">
<p class="text-slate-400 dark:text-slate-600 text-sm font-light mb-2">Teacher's Dashboard Preview</p>
<p class="text-slate-300 dark:text-slate-700 text-xs uppercase tracking-widest">Mobile Viewport</p>
</div>
</body></html>
